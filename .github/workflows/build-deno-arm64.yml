name: build-deno-arm64
on:
  workflow_dispatch:
    inputs:
      ref:
        description: deno git tag to build
        default: v2.9.5
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout deno
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/denoland/deno.git deno
      - name: Toolchain
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' deno/rust-toolchain.toml)" --profile minimal
          sudo apt-get update -qq && sudo apt-get install -y -qq clang libclang-dev
      - name: Patch — gate export-key enumeration behind an env var
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("deno/cli/lsp/resolver.rs")
          s = p.read_text()
          anchor = '       result: &mut Self| {\n        let export_keys = dep_package_json'
          patched = ('       result: &mut Self| {\n'
                     '        if std::env::var_os("DENO_LSP_SKIP_EXPORT_RESOLUTIONS").is_some() {\n'
                     '          return;\n'
                     '        }\n'
                     '        let export_keys = dep_package_json')
          assert s.count(anchor) == 1, s.count(anchor)
          p.write_text(s.replace(anchor, patched))
          print("patched")
          PY
      - name: Patch 2 — build ConfiguredDepResolutions lazily, per scope, on first use
        run: python3 .github/workflows/patch2.py
      - name: Build
        working-directory: deno
        run: cargo build --release --bin deno
      - uses: actions/upload-artifact@v4
        with:
          name: deno-aarch64-patched
          path: deno/target/release/deno
          retention-days: 7
